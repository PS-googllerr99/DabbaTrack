# Production stack: DabbaTrack behind Caddy, which gets and renews an HTTPS certificate automatically.
#   1. cp .env.example .env   (set PROVIDER_PIN and DOMAIN; point the domain's DNS at this server)
#   2. docker compose up -d --build
# See DEPLOY.md for backups, updates and the first-day checklist.
services:
  api:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/tiffin.db
      BACKUP_DIR: /data/backups
    volumes:
      - dabba-data:/data
    restart: unless-stopped
    stop_grace_period: 40s # > the server's 30 s request timeout, so in-flight requests can finish

  caddy:
    image: caddy:2
    depends_on:
      - api
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  dabba-data:
  caddy-data:
  caddy-config:
